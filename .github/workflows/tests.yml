name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: pytest -q
      # CLI smoke test with redirected output (catches console-encoding problems on Windows)
      - run: cofog-panel --version > version.txt && cofog-panel run --help > help.txt && cofog-panel list-sectors > sectors.txt

  # Oldest supported and newest Typer, each installed in a clean environment.
  # Typer 0.27 and later no longer install click, so the package must not import it.
  typer-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        typer: ["0.18.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install in a fresh virtual environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          if [ "${{ matrix.typer }}" = "latest" ]; then
            /tmp/venv/bin/python -m pip install --upgrade typer -e ".[dev]"
          else
            /tmp/venv/bin/python -m pip install "typer==${{ matrix.typer }}" -e ".[dev]"
          fi
          /tmp/venv/bin/python -m pip list | grep -i -E "^(typer|click) "
      - run: /tmp/venv/bin/python -m pytest -q
      # A missing source file must give the two-line error and exit code 1
      - run: |
          set +e
          /tmp/venv/bin/cofog-panel run --cofog 05 --source-file nope.xlsx > err.txt
          code=$?
          cat err.txt
          test "$code" -eq 1 && test "$(grep -c . err.txt)" -eq 2 && ! grep -q Unexpected err.txt
