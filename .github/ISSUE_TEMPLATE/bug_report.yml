name: Bug report
description: Report a problem or an unexpected result.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: COFOG-Panel version
      description: Output of `cofog-panel --version`
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Full error message
      render: text
